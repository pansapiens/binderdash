services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - binderdash
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  binderdash:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Remove port exposure - Caddy will handle external access
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Mount the run base directories as read-only volumes
      - ./example_runs:/app/example_runs:ro
      # Mount .env file inside the container if it exists
      - ./.env:/app/.env:ro
      # Persist SQLite under ./data on the host. This directory should be
      # created in advance and owned by the app user (1000:1000).
      - ./data:/app/data:rw
      # Mount the database file as read-write on the host
      - ./db.sqlite:/app/db.sqlite:rw
      # --- Optional: PAM against host local users (DISABLE BY DEFAULT)
      # Un-comment to let pam_unix see the same accounts as the Docker host. This
      # exposes host passwd/shadow to the container — use only on trusted hosts and
      # understand the risk. You may also need nsswitch + pam.d alignment; LDAP/SSSD
      # on the host usually needs more than these three files.
      # Two things bite here; see AGENTS.md "PAM in Docker":
      #  1. group_add "42" below is required as well, or every login fails.
      #  2. These are single-FILE mounts, so they pin an inode. passwd(1)
      #     REPLACES /etc/shadow, so host password changes and new users are
      #     invisible to a running container. `docker compose restart` does not
      #     help; recreate it: `docker compose up -d --force-recreate`.
      # - /etc/passwd:/etc/passwd:ro
      # - /etc/group:/etc/group:ro
      # - /etc/shadow:/etc/shadow:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Security: run as non-root user
    user: "1000:1000"
    # --- Required with the PAM mounts above (harmless otherwise, if gid 42 exists)
    # pam_unix shells out to /sbin/unix_chkpwd, which is setgid `shadow` but
    # refuses to use that privilege to check a user other than its caller. A
    # container running as uid 1000 is therefore always making a cross-user
    # request, and the helper returns PAM_AUTHINFO_UNAVAIL, which pam_unix
    # reports as an ordinary wrong-password failure. Joining group shadow (gid
    # 42 on Debian/Ubuntu) lets it read /etc/shadow in its own right.
    # group_add:
    #   - "42"
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  caddy_data:
  caddy_config:
