services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - binderdash
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  binderdash:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Remove port exposure - Caddy will handle external access
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Mount the run base directories as read-only volumes
      - ./example_runs:/app/example_runs:ro
      # Mount .env file inside the container if it exists
      - ./.env:/app/.env:ro
      # Persist SQLite under ./data on the host. This directory should be
      # created in advance and owned by the app user (1000:1000).
      - ./data:/app/data:rw
      # Mount the database file as read-write on the host
      - ./db.sqlite:/app/db.sqlite:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Security: run as non-root user
    user: "1000:1000"
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  caddy_data:
  caddy_config:
