services:
  binderdash:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_FRONTEND: "false"
    ports:
      #- "8001:8000"
      - "8911:8000"
    env_file:
      - .env.example
    environment:
      - RUN_BASE_DIRS=/example_runs
    volumes:
      - ./:/app
      - ./example_runs:/example_runs
      # Optional PAM with host local users (see docker-compose.yml for caveats):
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/shadow:/etc/shadow:ro
    working_dir: /app
    command: ["uvicorn", "backend.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  frontend-watcher:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_FRONTEND: "false"
    volumes:
      - ./:/app
    working_dir: /app/frontend
    command: ["pnpm", "run", "watch:build"]
    environment:
      # Vite + molstar/pdbe-molstar exceeds Node’s default old-space (~1 GiB) in slim containers.
      - NODE_OPTIONS=--max-old-space-size=3072
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
