[project]
name = "binderdash-backend"
version = "0.3.0"
description = "Backend for binderdash"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "pydantic-settings",
    "pandas",
    "bcrypt",
    "python-jose[cryptography]",
    "python-multipart",
    "requests",
    "biopython",
    "tmtools",
    "dnachisel",
    "authlib",
    "python-pam",
    "itsdangerous",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[tool.pytest.ini_options]
pythonpath = [".."]
markers = [
    "timeout(seconds): fail if test exceeds given duration",
]
